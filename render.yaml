services:
  - type: web
    name: support-triage-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AGENT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AGENT_TIMEOUT_SECONDS
        value: "180"
      - key: INPUT_PRICE_PER_MTOK
        value: "0"
      - key: OUTPUT_PRICE_PER_MTOK
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AGENT_MODEL
        value: claude-opus-5-5
      - key: AGENT_EFFORT
        value: medium
      - key: DAILY_SPEND_CAP_USD
        value: "5"
      - key: RUNS_PER_IP_PER_HOUR
        value: "10"
