services:
  - type: web
    name: support-triage-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AGENT_MODEL
        value: claude-opus-5-5
      - key: AGENT_EFFORT
        value: medium
      - key: DAILY_SPEND_CAP_USD
        value: "5"
      - key: RUNS_PER_IP_PER_HOUR
        value: "10"
